name: WEEEK API contract watch
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 1 * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run api:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weeek-api-contract-diff
          path: |
            reports/api-diff.json
            reports/api-candidate.json
          if-no-files-found: warn
